<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f6f6f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Adjust max-width to scale the icon to any size */
    .calculator-icon {
      width: 100%;
      max-width: 140px;
      height: auto;
      display: block;
      color: #000000; /* Controls the icon color via currentColor */
    }
  </style>
</head>
<body>

  <svg class="calculator-icon" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- True cutout mask so the screen and buttons are transparent holes -->
      <mask id="calc-cutout">
        <!-- White reveals the outer body -->
        <rect x="0" y="0" width="100" height="120" fill="#ffffff" />

        <!-- Black punches out the screen and buttons -->
        <g fill="#000000">
          <!-- Top Display Screen -->
          <rect x="27.5" y="29" width="45" height="13.5" rx="3" />

          <!-- Row 1 Keys -->
          <rect x="27" y="53" width="9.8" height="9.5" rx="2.8" />
          <rect x="45.1" y="53" width="9.8" height="9.5" rx="2.8" />
          <rect x="63.2" y="53" width="9.8" height="9.5" rx="2.8" />

          <!-- Row 2 Keys -->
          <rect x="27" y="71.5" width="9.8" height="9.5" rx="2.8" />
          <rect x="45.1" y="71.5" width="9.8" height="9.5" rx="2.8" />
          <rect x="63.2" y="71.5" width="9.8" height="9.5" rx="2.8" />

          <!-- Row 3 Keys (1 Square + 1 Wide Bar) -->
          <rect x="27" y="89.5" width="9.8" height="9.5" rx="2.8" />
          <rect x="45.1" y="89.5" width="27.9" height="9.5" rx="2.8" />
        </g>
      </mask>
    </defs>

    <!-- Main Rounded Calculator Body -->
    <rect 
      x="17.5" 
      y="14" 
      width="65" 
      height="92" 
      rx="8.5" 
      fill="currentColor" 
      mask="url(#calc-cutout)" 
    />
  </svg>

</body>
</html>
