<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Land Compare Map Icon</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #14171a; /* Dark map-like background for preview */
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Icon Wrapper with your exact hover specifications */
    .compare-land-pin {
      width: 180px; /* Change to e.g. 56px or 64px when placing on your actual map */
      height: 225px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(198, 164, 108, 0.25));
    }

    .compare-land-pin:hover {
      transform: scale(1.10);
      filter: drop-shadow(0 0 14px rgba(198, 164, 108, 0.75)) 
              drop-shadow(0 0 28px rgba(198, 164, 108, 0.35));
    }

    /* Optional subtle animation on hover for the balance scale & arrows */
    .compare-land-pin:hover .scale-beam {
      animation: gentleTilt 2.4s ease-in-out infinite;
      transform-origin: 100px 51px;
    }

    .compare-land-pin:hover .compare-arrow {
      animation: arrowPulse 1.6s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes gentleTilt {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    @keyframes arrowPulse {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.06); }
    }
  </style>
</head>
<body>

  <div class="compare-land-pin" title="Compare Land Plots">
    <svg 
      viewBox="0 0 200 250" 
      width="100%" 
      height="100%" 
      fill="none" 
      stroke="#c6a46c" 
      stroke-width="1.9" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- ================= OUTER MAP PIN & INNER RING ================= -->
      <path d="M 100 12 C 48 12 14 50 14 100 C 14 152 100 232 100 232 C 100 232 186 152 186 100 C 186 50 152 12 100 12 Z" />
      <circle cx="100" cy="100" r="75" />

      <!-- ================= TOP BALANCE SCALE ================= -->
      <g class="balance-scale">
        <!-- Base (Stepped pedestal) -->
        <line x1="83" y1="86" x2="117" y2="86" />
        <path d="M 88 86 L 91 82 L 109 82 L 112 86" />
        
        <!-- Center Pillar & Top Finial -->
        <line x1="100" y1="82" x2="100" y2="54" />
        <circle cx="100" cy="51" r="3" />
        <line x1="100" y1="48" x2="100" y2="44" />

        <!-- Scale Beam & Hanging Pans -->
        <g class="scale-beam">
          <!-- Horizontal Beam -->
          <line x1="78" y1="51" x2="122" y2="51" />

          <!-- Left Pan -->
          <line x1="80" y1="51" x2="73" y2="68" />
          <line x1="80" y1="51" x2="87" y2="68" />
          <path d="M 73 68 L 87 68 A 7 5.5 0 0 1 73 68 Z" />

          <!-- Right Pan -->
          <line x1="120" y1="51" x2="113" y2="68" />
          <line x1="120" y1="51" x2="127" y2="68" />
          <path d="M 113 68 L 127 68 A 7 5.5 0 0 1 113 68 Z" />
        </g>
      </g>

      <!-- ================= LEFT OPEN LAND PLOT ================= -->
      <g class="land-plot-left">
        <!-- Perspective Boundary Trapezoid -->
        <polygon points="52,106 84,106 92,134 42,134" />
        <!-- Internal Subdivision Grid Lines (Vertical/Perspective) -->
        <line x1="62.6" y1="106" x2="58.6" y2="134" />
        <line x1="73.3" y1="106" x2="75.3" y2="134" />
        <!-- Internal Subdivision Grid Lines (Horizontal) -->
        <line x1="48.8" y1="115" x2="86.6" y2="115" />
        <line x1="45.4" y1="124.5" x2="89.3" y2="124.5" />
        <!-- Corner Land Marker Flag -->
        <line x1="56" y1="110" x2="56" y2="88" />
        <polygon points="56,88 71,88 67,93.5 71,99 56,99" />
      </g>

      <!-- ================= RIGHT OPEN LAND PLOT ================= -->
      <g class="land-plot-right">
        <!-- Perspective Boundary Trapezoid -->
        <polygon points="116,106 148,106 158,134 108,134" />
        <!-- Internal Subdivision Grid Lines (Vertical/Perspective) -->
        <line x1="126.6" y1="106" x2="124.6" y2="134" />
        <line x1="137.3" y1="106" x2="141.3" y2="134" />
        <!-- Internal Subdivision Grid Lines (Horizontal) -->
        <line x1="113.4" y1="115" x2="151.2" y2="115" />
        <line x1="110.7" y1="124.5" x2="154.6" y2="124.5" />
        <!-- Corner Land Marker Flag -->
        <line x1="140" y1="110" x2="140" y2="88" />
        <polygon points="140,88 155,88 151,93.5 155,99 140,99" />
      </g>

      <!-- ================= CENTER "VS" TEXT ================= -->
      <text 
        x="100" 
        y="117" 
        text-anchor="middle" 
        fill="#c6a46c" 
        stroke="none" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="14.5" 
        font-weight="700" 
        letter-spacing="0.8"
      >VS</text>

      <!-- ================= BOTTOM TWO-WAY ARROW ================= -->
      <g class="compare-arrow">
        <line x1="68" y1="147" x2="132" y2="147" />
        <polyline points="74,141 68,147 74,153" />
        <polyline points="126,141 132,147 126,153" />
      </g>
    </svg>
  </div>

</body>
</html>
