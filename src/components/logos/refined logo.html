<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILA HOMES</title>
  <style>
    :root {
      --bg: #000000;
      --gold-primary: #d4af7a;
      --gold-muted: #5e503f;
      --white: #ffffff;
      --ease-lux: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      position: relative;
      width: 90vw;
      max-width: 940px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    svg.logo-canvas {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
    }

    /* ========================================================
       PHASE 1: EXACT ROOF & PILLAR (0.7s – 1.8s)
       ======================================================== */
    .roof-structure {
      opacity: 0;
      transform: translateY(24px);
      fill: var(--gold-primary);
      animation: 
        roofGlide 0.95s var(--ease-lux) 0.3s forwards,
        toSolidWhite 0.9s var(--ease-lux) 2.25s forwards;
    }

    /* ========================================================
       PHASE 2: TYPOGRAPHY BASELINE RISE (0.6s – 1.6s)
       ======================================================== */
    .char {
      opacity: 0;
      transform: translateY(35px);
      fill: var(--gold-muted);
      animation: 
        charRise 0.85s var(--ease-lux) forwards,
        toSolidWhite 0.9s var(--ease-lux) 2.25s forwards;
    }

    .char-ila { fill: var(--gold-primary); }

    .c-i { animation-delay: 0.60s, 2.25s; }
    .c-l { animation-delay: 0.67s, 2.25s; }
    .c-a { animation-delay: 0.74s, 2.25s; }
    .c-h { animation-delay: 0.83s, 2.25s; }
    .c-o { animation-delay: 0.90s, 2.25s; }
    .c-m { animation-delay: 0.97s, 2.25s; }
    .c-e { animation-delay: 1.04s, 2.25s; }
    .c-s { animation-delay: 1.11s, 2.25s; }

    /* ========================================================
       PHASE 3: SPECULAR SHEEN SWEEP (2.3s – 3.3s)
       ======================================================== */
    .sheen-runner {
      transform: translateX(-400px) skewX(-24deg);
      animation: sheenSweep 1.15s var(--ease-lux) 2.35s forwards;
    }

    /* Minimal Progress Line */
    .progress-track {
      width: 140px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold-primary), var(--white));
      transform: translateX(-100%);
      animation: progressRun 2.8s var(--ease-lux) 0.1s forwards;
    }

    /* Keyframes */
    @keyframes roofGlide {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes charRise {
      0% { opacity: 0; transform: translateY(35px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes toSolidWhite {
      0% { fill: var(--gold-primary); }
      40% { fill: var(--white); filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.65)); }
      100% { fill: var(--white); filter: drop-shadow(0 0 0px transparent); }
    }

    @keyframes sheenSweep {
      0% { transform: translateX(-400px) skewX(-24deg); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateX(1200px) skewX(-24deg); opacity: 0; }
    }

    @keyframes progressRun {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0%); }
    }

    .replay-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.45);
      padding: 0.5rem 1.3rem;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .replay-btn:hover {
      border-color: var(--white);
      color: var(--white);
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
