<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILA HOMES - Luxury Architectural Reveal</title>
  <style>
    :root {
      --bg-core: #141619;
      --bg-edge: #090a0c;
      --gold-primary: #d4af7a;
      --gold-light: #f3e5ab;
      --gold-muted: #5e503f;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 45%, var(--bg-core) 0%, var(--bg-edge) 80%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 92%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
    }

    /* Ambient background glow that breathes during Step 04 */
    .ambient-backdrop {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 420px;
      height: 120px;
      transform: translate(-50%, -55%);
      background: radial-gradient(ellipse at center, rgba(212, 175, 122, 0.18) 0%, transparent 70%);
      filter: blur(25px);
      opacity: 0;
      pointer-events: none;
      animation: ambientPulse 2.2s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }

    svg.logo-canvas {
      width: 100%;
      height: auto;
      overflow: visible;
      z-index: 2;
    }

    /* =====================================================
       STEP 01: NEAT MASKED BASELINE RISE (STAGGERED)
       ===================================================== */
    .char {
      opacity: 0;
      transform: translateY(26px);
      fill: var(--gold-muted);
      animation: 
        charRise 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        charSolidWhite 0.9s cubic-bezier(0.22, 1, 0.36, 1) 2.25s forwards;
    }

    /* "ILA" starts brighter and shifts earlier */
    .char-ila {
      fill: var(--gold-primary);
    }

    .c-1 { animation-delay: 0.10s, 2.25s; }
    .c-2 { animation-delay: 0.16s, 2.25s; }
    .c-3 { animation-delay: 0.22s, 2.25s; }
    .c-4 { animation-delay: 0.30s, 2.25s; }
    .c-5 { animation-delay: 0.36s, 2.25s; }
    .c-6 { animation-delay: 0.42s, 2.25s; }
    .c-7 { animation-delay: 0.48s, 2.25s; }
    .c-8 { animation-delay: 0.54s, 2.25s; }

    /* Subtle golden baseline laser that sweeps under ILA in Step 1 */
    .baseline-laser {
      stroke: url(#gold-grad);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 140;
      stroke-dashoffset: 140;
      opacity: 0;
      filter: drop-shadow(0 0 6px var(--gold-primary));
      animation: laserSweep 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    /* =====================================================
       STEP 02: THE ROOF RISE (GLIDE + LINE DRAW)
       ===================================================== */
    .roof-wrap {
      transform: translateY(18px);
      animation: roofGlide 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards;
    }

    .roof-line {
      fill: none;
      stroke: url(#gold-grad);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      filter: drop-shadow(0 0 8px rgba(212, 175, 122, 0.4));
      animation: 
        roofDraw 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards,
        strokeToWhite 0.9s ease 2.25s forwards;
    }

    .roof-line.inner {
      stroke-width: 4.5;
      animation-delay: 0.95s, 2.25s;
    }

    /* =====================================================
       STEP 03: PILLAR SLIDE & LOCK (PRECISION DROP)
       ===================================================== */
    .pillar-wrap {
      opacity: 0;
      transform: translateY(-24px);
      animation: pillarLock 0.75s cubic-bezier(0.22, 1, 0.36, 1) 1.55s forwards;
    }

    .pillar-shape {
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 5;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
      filter: drop-shadow(0 0 8px rgba(212, 175, 122, 0.4));
      animation: strokeToWhite 0.9s ease 2.25s forwards;
    }

    /* =====================================================
       STEP 04: SOLID REVEAL
       ===================================================== */
    .logo-master {
      animation: masterGlow 1.5s ease-out 2.25s forwards;
    }

    /* Minimalist Progress Scrubber */
    .progress-track {
      width: 140px;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold-primary), var(--white));
      transform: translateX(-100%);
      animation: progressRun 2.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    /* =====================================================
       KEYFRAMES
       ===================================================== */
    @keyframes charRise {
      0% {
        opacity: 0;
        transform: translateY(26px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes charSolidWhite {
      0% {
        fill: var(--gold-primary);
      }
      40% {
        fill: var(--white);
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.65));
      }
      100% {
        fill: var(--white);
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.25));
      }
    }

    @keyframes laserSweep {
      0% { opacity: 0; stroke-dashoffset: 140; }
      30% { opacity: 1; }
      100% { opacity: 0; stroke-dashoffset: -140; }
    }

    @keyframes roofGlide {
      0% { transform: translateY(18px); }
      100% { transform: translateY(0); }
    }

    @keyframes roofDraw {
      0% { stroke-dashoffset: 240; opacity: 0; }
      20% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes pillarLock {
      0% {
        opacity: 0;
        transform: translateY(-24px);
      }
      70% {
        opacity: 1;
        transform: translateY(1.5px); /* Crisp mechanical settle */
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes strokeToWhite {
      0% {
        stroke: var(--gold-primary);
      }
      40% {
        stroke: var(--white);
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.7));
      }
      100% {
        stroke: var(--white);
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.25));
      }
    }

    @keyframes sheenSweep {
      0% { transform: translateX(-180px) skewX(-25deg); }
      100% { transform: translateX(780px) skewX(-25deg); }
    }

    @keyframes ambientPulse {
      0% { opacity: 0; transform: translate(-50%, -55%) scale(0.8); }
      45% { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
      100% { opacity: 0.45; transform: translate(-50%, -55%) scale(1); }
    }

    @keyframes progressRun {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0%); }
    }

    /* Replay Button */
    .replay-btn {
      background: transparent;
      border: 1px solid rgba(212, 175, 122, 0.25);
      color: rgba(255, 255, 255, 0.55);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .replay-btn:hover {
      border-color: var(--gold-primary);
      color: var(--white);
      background: rgba(212, 175, 122, 0.08);
    }
  </style>
</head>
<body>

  <div class="stage" id="animation-stage">
    <div class="ambient-backdrop"></div>

    <svg class="logo-canvas" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Luxury Metallic Gold Gradient -->
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c59b61" />
          <stop offset="50%" stop-color="#f3e5ab" />
          <stop offset="100%" stop-color="#d4af7a" />
        </linearGradient>

        <!-- Shimmer Gradient for Step 04 Light Sweep -->
        <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(255,255,255,0)" />
          <stop offset="50%" stop-color="rgba(255,248,231,0.85)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>

        <!-- Clean Horizontal Clip Mask so letters rise out of an invisible floor -->
        <clipPath id="text-floor-mask">
          <rect x="30" y="80" width="500" height="75" />
        </clipPath>

        <!-- Clip Mask for the Final Shimmer Overlay -->
        <clipPath id="full-logo-mask">
          <rect x="46" y="94" width="10" height="44" rx="0.5" />
          <path d="M 62 94 H 72 V 136 H 104 V 146 H 68 Q 62 146 62 140 Z" />
          <path d="M 118 94 H 132 L 158 138 H 145 L 139 128 H 111 L 105 138 H 92 Z M 116 119 H 134 L 125 103 Z" />
          <path d="M 184 94 H 195 V 111 H 222 V 94 H 233 V 138 H 222 V 121 H 195 V 138 H 184 Z" />
          <path d="M 254 94 H 284 Q 296 94 296 106 V 126 Q 296 138 284 138 H 254 Q 242 138 242 126 V 106 Q 242 94 254 94 Z" />
          <path d="M 306 94 H 320 L 336 118 L 352 94 H 366 V 138 H 355 V 109 L 336 136 L 317 109 V 138 H 306 Z" />
          <path d="M 378 94 H 426 V 103 H 389 V 111 H 422 V 120 H 389 V 129 H 426 V 138 H 378 Z" />
          <path d="M 446 94 H 484 Q 492 94 492 102 V 105 H 481 V 103 H 447 V 111 H 483 Q 492 111 492 120 V 129 Q 492 138 483 138 H 444 Q 435 138 435 129 V 125 H 446 V 129 H 481 V 120 H 445 Q 436 120 436 111 V 102 Q 436 94 446 94 Z" />
        </clipPath>
      </defs>

      <g class="logo-master">
        <!-- STEP 02: THE ROOF RISE (Draws + Glides Simultaneously) -->
        <g class="roof-wrap">
          <path class="roof-line outer" d="M 352 84 L 386 50 L 420 84 L 518 84" />
          <path class="roof-line inner" d="M 365 84 L 386 63 L 407 84 L 518 84" />
        </g>

        <!-- STEP 03: PILLAR SLIDE & LOCK -->
        <g class="pillar-wrap">
          <path class="pillar-shape" d="M 526 69 L 542 83 L 542 141 L 526 141 Z" />
          <line class="pillar-shape" x1="526" y1="132" x2="542" y2="132" />
        </g>

        <!-- STEP 01: STAGGERED ARCHITECTURAL TYPOGRAPHY (Masked Floor Rise) -->
        <g clip-path="url(#text-floor-mask)">
          <!-- I -->
          <rect class="char char-ila c-1" x="46" y="94" width="10" height="44" rx="0.5" />
          <!-- L -->
          <path class="char char-ila c-2" d="M 62 94 H 72 V 136 H 104 V 146 H 68 Q 62 146 62 140 Z" />
          <!-- A -->
          <path class="char char-ila c-3" d="M 118 94 H 132 L 158 138 H 145 L 139 128 H 111 L 105 138 H 92 Z M 116 119 H 134 L 125 103 Z" />
          <!-- H -->
          <path class="char c-4" d="M 184 94 H 195 V 111 H 222 V 94 H 233 V 138 H 222 V 121 H 195 V 138 H 184 Z" />
          <!-- O -->
          <path class="char c-5" d="M 254 94 H 284 Q 296 94 296 106 V 126 Q 296 138 284 138 H 254 Q 242 138 242 126 V 106 Q 242 94 254 94 Z M 253 106 V 126 Q 253 128 256 128 H 282 Q 285 128 285 126 V 106 Q 285 104 282 104 H 256 Q 253 104 253 106 Z" />
          <!-- M -->
          <path class="char c-6" d="M 306 94 H 320 L 336 118 L 352 94 H 366 V 138 H 355 V 109 L 336 136 L 317 109 V 138 H 306 Z" />
          <!-- E -->
          <path class="char c-7" d="M 378 94 H 426 V 103 H 389 V 111 H 422 V 120 H 389 V 129 H 426 V 138 H 378 Z" />
          <!-- S -->
          <path class="char c-8" d="M 446 94 H 484 Q 492 94 492 102 V 105 H 481 V 103 H 447 V 111 H 483 Q 492 111 492 120 V 129 Q 492 138 483 138 H 444 Q 435 138 435 129 V 125 H 446 V 129 H 481 V 120 H 445 Q 436 120 436 111 V 102 Q 436 94 446 94 Z" />
        </g>
      </g>
    </svg>

    <button class="replay-btn" onclick="replay()">Replay</button>
  </div>

  <script>
    function replay() {
      const stage = document.getElementById('animation-stage');
      const clone = stage.cloneNode(true);
      stage.parentNode.replaceChild(clone, stage);
    }
  </script>
</body>
</html>
